services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n-veille
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_AUTH_PASSWORD:?Set N8N_AUTH_PASSWORD in .env}
      - GENERIC_TIMEZONE=Europe/Paris
      - TZ=Europe/Paris
      - N8N_RESTRICT_FILE_ACCESS_TO=/data/veilleur
    volumes:
      - n8n_data:/home/node/.n8n
      - /Users/sn0rks/Code/github.com/allienna/veilleur/data:/data/veilleur

volumes:
  n8n_data: